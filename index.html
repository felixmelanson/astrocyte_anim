<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liddelow et al. 2017 · Methods</title>
<link rel="stylesheet" href="css/viewer.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="controls">
  <button id="ctlPrev" aria-label="Previous step">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
  </button>
  <button id="ctlPlay" aria-label="Pause">
    <svg class="icon-pause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    <svg class="icon-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:none"><path d="M7 5v14l12-7z"/></svg>
  </button>
  <button id="ctlNext" aria-label="Next step">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
  </button>
  <button id="ctlReplay" class="phone-hide" aria-label="Replay step">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>
  <input id="ctlScrub" type="range" min="0" max="20" step="0.02" value="0">
  <span id="stepLabel">1 / 22</span>
  <button id="ctlTheme" aria-label="Switch to light">
    <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 9 9 0 1 0 20.5 14.5z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
  </button>
  <button id="ctlFullscreen" class="phone-hide" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
</div>

<script src="js/core/math.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/arbor.js"></script>
<script src="js/core/builders.js"></script>
<script src="js/core/cell.js"></script>
<script src="js/core/round.js"></script>
<script src="js/core/glyphs.js"></script>
<script src="js/core/fields.js"></script>
<script src="js/core/hardware.js"></script>

<script src="js/scenes/actors.js"></script>
<script src="js/scenes/scene1.js"></script>
<script src="js/scenes/scene2.js"></script>
<script src="js/scenes/scene3.js"></script>
<script src="js/scenes/scene4.js"></script>
<script src="js/scenes/scene5.js"></script>

<script src="js/app.js"></script>
<script src="js/controls.js"></script>
</body>
</html>
